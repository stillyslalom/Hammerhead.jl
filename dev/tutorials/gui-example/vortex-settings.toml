# Hammerhead processing settings (PIVRecipe)
recipe_format_version = 3
hammerhead_version = "0.2.1"
mode = "sequence"
image_type = "Float64"
mask = "vortex-settings.mask.png"
predictor_smoothing = true
mask_threshold = 0.5
ptv_predictor = "piv"
min_track_length = 3
max_gap = 0

[[passes]]
window_size = [64, 64]
search_area_size = [64, 64]
overlap = [32, 32]
correlation_method = "cross"
padding = false
apodization = "none"
subpixel_method = "gauss3"
n_peaks = 3
peak_finder = "regionalmax"
uncertainty = false
uod_enable = true
uod_threshold = 2.0
uod_neighborhood = 2
min_peak_ratio = 1.0
validation = []
replace_outliers = true
max_iterations = 1
convergence_tol = 0.05
keep_correlation_planes = false
image_interpolation = "cubic"
predictor_interpolation = "linear"

[[passes]]
window_size = [32, 32]
search_area_size = [32, 32]
overlap = [16, 16]
correlation_method = "cross"
padding = false
apodization = "none"
subpixel_method = "gauss3"
n_peaks = 3
peak_finder = "regionalmax"
uncertainty = false
uod_enable = true
uod_threshold = 2.0
uod_neighborhood = 2
min_peak_ratio = 1.0
validation = []
replace_outliers = true
max_iterations = 1
convergence_tol = 0.05
keep_correlation_planes = false
image_interpolation = "cubic"
predictor_interpolation = "linear"

[[preprocessing]]
operation = "highpass_filter"
sigma = 3.0

[ptv]
uod_enable = true
uod_threshold = 2.0
threshold = "auto"
threshold_k = 4.0
min_separation = 2.0
min_diameter = 1.0
max_diameter = 12.0
search_radius = 3.0
intensity_weight = 0.0
diameter_weight = 0.0
uod_neighbors = 8
uod_epsilon = 0.1

[scale]
pixel_size = 0.02
dt = 0.001
length_unit = "mm"
time_unit = "s"
